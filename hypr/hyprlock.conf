general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

label {
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    color = rgb(cba6f7)
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = JetBrainsMono Nerd Font Extrabold
    color = rgb(bac2de)
    position = 0, 105
    halign = center
    valign = center
}

input-field {
    size = 280, 48
    position = 0, -60
    halign = center
    valign = center
    
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    rounding = 16
    
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8"><i>󰌾 Input Password...</i></span>
    
    outer_color = rgba(cba6f7ff) rgba(89b4faff) 45deg
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    
    shadow_passes = 2
    shadow_size = 5
}

label {
    text = $FAIL
    color = rgb(f38ba8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -115
    halign = center
    valign = center
}