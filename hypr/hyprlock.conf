general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 12
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    inner_color = rgb(1e1e2e)
    outer_color = rgb(cba6f7)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
}

label {
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +'%A, %d %B'
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(a6adc8)
    position = 0, 80
    halign = center
    valign = center
}
