source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
    pam_module = hyprlock
}

# ╭──────────────────────────────────────────────╮
# │                 BACKGROUND                   │
# ╰──────────────────────────────────────────────╯

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 7

    noise = 0.015
    contrast = 0.92
    brightness = 0.72

    vibrancy = 0.18
    vibrancy_darkness = 0.0
}


# ╭──────────────────────────────────────────────╮
# │                 GLASS CARD                  │
# ╰──────────────────────────────────────────────╯

shape {
    monitor =

    size = 470, 520

    color = $surface
    rounding = 32

    border_size = 2
    border_color = $primary

    position = 0, 0

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                    TIME                      │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = $on_surface

    font_size = 88
    font_family = JetBrainsMono Nerd Font

    position = 0, 125

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                    DATE                      │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A  ·  %d %B')"

    color = $on_surface_variant

    font_size = 17
    font_family = JetBrainsMono Nerd Font

    position = 0, 63

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                  SEPARATOR                   │
# ╰──────────────────────────────────────────────╯

shape {
    monitor =

    size = 70, 3

    color = $primary
    rounding = 3

    position = 0, 20

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                    USER                      │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = "󰀄  sairex"

    color = $primary

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -45

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                 PASSWORD                    │
# ╰──────────────────────────────────────────────╯

input-field {
    monitor =

    size = 330, 58

    outline_thickness = 2

    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface

    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true

    fade_on_empty = false

    placeholder_text = <i>󰌆  Password</i>

    hide_input = false

    rounding = 18

    position = 0, -120

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                  CAPS LOCK                  │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = cmd[update:500] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .capsLock' | grep -q true && echo '󰪛  CAPS LOCK')"

    color = $error

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -173

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                 BOTTOM INFO                 │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = "󰍹  NixOS  ·  Hyprland"

    color = $on_surface_variant

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -195

    halign = center
    valign = center
}


# ╭──────────────────────────────────────────────╮
# │                    POWER                    │
# ╰──────────────────────────────────────────────╯

label {
    monitor =

    text = "󰐥"

    color = $primary

    font_size = 19
    font_family = JetBrainsMono Nerd Font

    position = 0, 185

    halign = center
    valign = center
}
